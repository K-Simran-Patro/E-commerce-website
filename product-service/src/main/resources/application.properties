# Application
spring.application.name=product-service
server.port=8082

# PostgreSQL Database Configuration
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
# used for translator to talk to postgreSQL database,this driver translates btw java and postgreSQL

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
#If you add a new column, Hibernate will update the table for you. No manual work!
spring.jpa.show-sql=true

spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
#this tells Hibernate exactly which one so it talks correctly to the database and uses the right SQL syntax for that database.